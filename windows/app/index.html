<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'">
<title>日記</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bubbles"></div>

<aside class="sidebar" inert>
  <h1>我的日記 ✿</h1>
  <div class="seg">
    <button class="on" data-mode="list">日記</button>
    <button data-mode="calendar">月曆</button>
    <button data-mode="weight">體重</button>
    <i class="seg-pill"></i>
  </div>
  <div id="weightPanel" class="weight-panel hidden">
    <div class="w-input">
      <div class="scale-icon">⚖️</div>
      <input id="wDate" type="date">
      <div class="kg"><input id="wKg" type="number" step="0.1" min="20" max="300" placeholder="0.0"><span>kg</span></div>
      <button id="wSave">記錄 ♥</button>
    </div>
    <div id="wList" class="w-list"></div>
  </div>
  <input id="search" class="search" placeholder="🔍 搜尋日記">
  <div id="cal" class="cal hidden">
    <div class="calhead"><button id="prev">‹</button><span id="month"></span><button id="next">›</button></div>
    <div class="grid" id="grid"></div>
  </div>
  <div id="cards" class="cards"></div>
  <button class="add" id="add" title="寫新日記 (Ctrl+N)">✎</button>
</aside>

<main class="detail" inert>
  <div id="emptyDetail" class="empty-detail">
    <div class="mascot big"><div class="eyes"><i class="eye"></i><i class="eye"></i></div><div class="cheeks"><i class="cheek"></i><i class="cheek"></i></div><i class="mouth"></i></div>
    <p>選一篇日記，或寫一篇新的吧</p>
  </div>
  <section id="weightView" class="weight-view hidden">
    <h2>體重變化 📈</h2>
    <div class="stats" id="wStats"></div>
    <div class="chart-card">
      <div class="range" id="wRange">
        <button data-days="7">7 天</button><button data-days="30" class="on">30 天</button><button data-days="90">90 天</button><button data-days="0">全部</button>
      </div>
      <div id="chart"></div>
    </div>
  </section>
  <section id="editor" class="editor hidden">
    <header><span id="edDate"></span><button id="done">♥ 完成</button></header>
    <div class="moods" id="moods"></div>
    <textarea id="body" placeholder="今天發生了什麼事呢？"></textarea>
    <div class="count" id="count">0 字</div>
  </section>
</main>

<div class="splash" id="splash">
  <div class="mascot big"><div class="eyes"><i class="eye"></i><i class="eye"></i></div><div class="cheeks"><i class="cheek"></i><i class="cheek"></i></div><i class="mouth"></i></div>
  <h2>今天過得好嗎？</h2>
</div>

<button id="lockDiary" class="lock-diary hidden">🔒 鎖定</button>
<dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmMessage">
  <p id="confirmMessage"></p>
  <div class="confirm-actions">
    <button type="button" id="confirmCancel" autofocus>取消</button>
    <button type="button" id="confirmOk">刪除</button>
  </div>
</dialog>
<div class="secure-gate" id="secureGate" role="dialog" aria-modal="true" aria-label="解鎖日記">
  <form class="secure-gate-card" id="vaultForm">
    <div class="scale-icon">🔐</div>
    <p id="secureGateMessage" role="status">正在讀取加密設定…</p>
    <label>日記密碼<input id="vaultPassword" type="password" autocomplete="current-password" required maxlength="1024"></label>
    <label id="confirmLabel" class="hidden">再次輸入密碼<input id="vaultConfirm" type="password" autocomplete="new-password" maxlength="1024"></label>
    <p>建議使用密碼管理器產生長密碼。沒有密碼復原或重設功能；忘記密碼將無法讀取日記。</p>
    <p>切換視窗、鎖定電腦或閒置 5 分鐘會自動鎖定。</p>
    <button id="vaultSubmit" type="submit" disabled>解鎖</button>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
